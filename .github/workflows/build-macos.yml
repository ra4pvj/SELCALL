name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build universal app (arm64 + x86_64) and run self-test
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Python reference self-test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet numpy
          .venv/bin/python python/selcall.py selftest

      - uses: actions/upload-artifact@v5
        with:
          name: HFSelcall-macOS
          path: |
            build/HFSelcall.zip
            build/selcall-cli
          if-no-files-found: error
