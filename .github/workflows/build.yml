name: Build macOS + Windows and release

# main  -> пересобирается пре-релиз "latest"; если в файле VERSION номер, для которого ещё нет
#          релиза, — дополнительно создаётся тег vX.Y.Z и постоянный релиз (поднять версию = поменять VERSION)
# тег v* -> постоянный релиз с этим номером
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build universal app (arm64 + x86_64) and run self-test
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Python reference self-test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet numpy
          .venv/bin/python python/selcall.py selftest

      - name: Package
        run: |
          mkdir -p out
          cp build/HFSelcall.zip out/HFSelcall-macOS.zip
          (cd build && zip -q ../out/selcall-cli-macOS.zip selcall-cli)

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            boot: Windows-64bit-intel
          - arch: x86
            boot: Windows-32bit-intel
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Python 3.8 — последняя версия с поддержкой Windows 7 SP1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: ${{ matrix.arch }}

      - name: Dependencies (Win7-compatible versions)
        run: |
          python -VV
          python -m pip install --upgrade "pip<25"
          python -m pip install -r windows/requirements-win7.txt "pyinstaller==5.13.2" "pyinstaller-hooks-contrib<2025" pefile

      - name: Version
        run: |
          $v = "v" + (Get-Content VERSION -Raw).Trim() + "+" + (git rev-parse --short HEAD)
          "VERSION = '$v'" | Out-File -Encoding ascii windows/_version.py
          "Version: $v"

      - name: Self-test from source (codec + Windows app)
        run: |
          python python/selcall.py selftest
          python windows/hfselcall_win.py --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Windows 7 compatibility scan (DLL/PYD/bootloader imports)
        run: |
          $base = python -c "import sys; print(sys.base_prefix)"
          $np = python -c "import numpy, os; print(os.path.dirname(numpy.__file__))"
          $sdd = python -c "import _sounddevice_data, os; print(os.path.dirname(_sounddevice_data.__file__))"
          $boot = python -c "import PyInstaller, os; print(os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', '${{ matrix.boot }}'))"
          python windows/check_win7.py "$base\python38.dll" "$base\DLLs" $np $sdd $boot
          # загрузчик exe стартует ДО распаковки встроенного UCRT — он не должен сам требовать UCRT
          python -c "import pefile,sys; pe=pefile.PE(sys.argv[1]); d=sorted({e.dll.decode().lower() for e in pe.DIRECTORY_ENTRY_IMPORT}); print('bootloader imports:', d); bad=[x for x in d if x.startswith('api-ms-win-crt') or x in ('ucrtbase.dll','vcruntime140.dll')]; print('bootloader needs UCRT/VC runtime:', bad or 'no'); sys.exit(1 if bad else 0)" "$boot\runw.exe"

      # сборка папкой (onedir), как в HFP: ничего не распаковывается в %TEMP% при запуске
      # (на Win7 onefile давал «Failed to extract ... dll»); UCRT кладётся рядом с exe
      - name: Build exe folder (PyInstaller 5.13 onedir, UCRT bundled for Win7 without KB2999226)
        working-directory: windows
        run: |
          $ucrt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Redist" -Recurse -Directory -Filter ${{ matrix.arch }} |
                  Where-Object { $_.FullName -match '\\ucrt\\DLLs\\' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $ucrt) { throw "UCRT redistributable not found" }
          "UCRT: $($ucrt.FullName)  ($((Get-ChildItem "$($ucrt.FullName)\*.dll").Count) dll)"
          python -m PyInstaller --noconfirm --onedir --windowed --name HFSelcall `
            --paths ..\python --collect-all sounddevice --collect-all _sounddevice_data `
            --hidden-import selcall_ptt --hidden-import serial.tools.list_ports `
            --add-binary "$($ucrt.FullName)\*.dll;." `
            hfselcall_win.py

      - name: Self-test of the built exe
        working-directory: windows
        run: |
          $p = Start-Process -FilePath dist\HFSelcall\HFSelcall.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\HFSelcall\selftest.txt
          if ($p.ExitCode -ne 0) { throw "exe self-test failed ($($p.ExitCode))" }
          Remove-Item dist\HFSelcall\selftest.txt
          "ucrtbase.dll next to exe: $(Test-Path dist\HFSelcall\ucrtbase.dll)"
          python check_win7.py dist\HFSelcall

      - name: Package
        run: |
          Copy-Item windows\README_WINDOWS.txt windows\dist\HFSelcall\
          Compress-Archive -Path windows\dist\HFSelcall -DestinationPath "HFSelcall-Windows-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: windows-${{ matrix.arch }}
          path: HFSelcall-Windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04          # старый glibc 2.35 — запускается на большинстве современных дистрибутивов
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libportaudio2
          python -m pip install "numpy<2" "sounddevice==0.4.6" "pyserial==3.5" "pyinstaller==6.11.1"
          echo "VERSION = 'v$(tr -d ' \r\n' < VERSION)+$(git rev-parse --short HEAD)'" > windows/_version.py

      - name: Self-test from source
        run: |
          python python/selcall.py selftest
          python windows/hfselcall_win.py --selftest

      - name: Build (PyInstaller onedir)
        working-directory: windows
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name HFSelcall \
            --paths ../python --collect-all sounddevice \
            --hidden-import selcall_ptt --hidden-import serial.tools.list_ports \
            hfselcall_win.py
          ./dist/HFSelcall/HFSelcall --selftest
          cat dist/HFSelcall/selftest.txt && rm dist/HFSelcall/selftest.txt

      - name: Package
        run: |
          cp windows/README_WINDOWS.txt windows/dist/HFSelcall/README.txt
          cat > windows/dist/HFSelcall/README_LINUX.txt <<'EOF'
          HF Selcall для Linux (x86_64, glibc 2.35+: Ubuntu 22.04+, Debian 12+, Mint 21+ и т.п.)
          Нужна системная библиотека PortAudio:  sudo apt install libportaudio2
          Запуск: распакуйте архив, ./HFSelcall/HFSelcall
          COM-порт для PTT/CAT: /dev/ttyUSB0, /dev/ttyACM0 — пользователь должен быть в группе dialout
          (sudo usermod -aG dialout $USER, затем перелогиниться).
          Остальное — как в README.txt (версия для Windows; интерфейс тот же).
          EOF
          sed -i 's/^          //' windows/dist/HFSelcall/README_LINUX.txt
          tar -C windows/dist -czf HFSelcall-Linux-x64.tar.gz HFSelcall

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: HFSelcall-Linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [macos, windows, linux]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la dist
          NOTES="Сборка ${GITHUB_SHA::7}.

          **macOS 13+** (Apple Silicon и Intel): HFSelcall-macOS.zip → перенесите «HF Selcall.app» в «Программы». Приложение не нотаризовано: первый запуск — правый клик → «Открыть».

          **Windows 7 SP1 / 8 / 10 / 11**: HFSelcall-Windows-x64.zip (64-бит) или HFSelcall-Windows-x86.zip (32-бит; для 32-битной Windows 7). Распакуйте архив целиком (папка HFSelcall) и запустите HFSelcall.exe внутри, установка не нужна. На Windows 7 нужен SP1 и обновление KB2533623 (обычно уже есть); UCRT уже лежит в папке программы. SmartScreen: «Подробнее» → «Выполнить в любом случае».

          **Linux** x86_64 (Ubuntu 22.04+, Debian 12+ …): HFSelcall-Linux-x64.tar.gz; нужна libportaudio2 (sudo apt install libportaudio2).

          selcall-cli-macOS.zip — консольный кодер/декодер для macOS."
          # отозванные релизы (список в .github/retracted-releases.txt) удаляются вместе с тегами
          grep -vE '^\s*(#|$)' .github/retracted-releases.txt 2>/dev/null | while read -r old; do
            if gh release view "$old" -R "$REPO" >/dev/null 2>&1; then
              echo "Удаляю отозванный релиз $old"
              gh release delete "$old" -R "$REPO" --yes --cleanup-tag
            fi
          done
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" dist/* -R "$REPO" --title "HF Selcall $TAG" --notes "$NOTES"
          else
            gh release delete latest -R "$REPO" --yes --cleanup-tag || true
            gh release create latest dist/* -R "$REPO" --target "$GITHUB_SHA" --prerelease \
              --title "HF Selcall (последняя сборка ${GITHUB_SHA::7})" --notes "$NOTES"
            TAG="v$(tr -d ' \r\n' < VERSION)"
            if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
              gh release create "$TAG" dist/* -R "$REPO" --target "$GITHUB_SHA" --latest \
                --title "HF Selcall $TAG" --notes "$NOTES"
            else
              # релиз версии уже есть: дописываем только недостающие файлы (новые платформы), не перезаписывая
              have=$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name')
              for f in dist/*; do
                grep -qxF "$(basename "$f")" <<< "$have" || gh release upload "$TAG" "$f" -R "$REPO"
              done
            fi
          fi
